version: '3.8'

services:
  # Database for Study Service, Auth Service, and AI Service
  postgres:
    image: postgres:15-alpine
    container_name: studyflow_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Spring Boot Auth Service
  auth-service:
    build:
      context: ./auth-service
    container_name: studyflow_auth
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    networks:
      default:
        aliases:
          - auth.studyflow.internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  # Study Service
  study-service:
    build:
      context: ./study-service
    container_name: studyflow_study
    ports:
      - "${STUDY_SERVICE_PORT:-8081}:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    volumes:
      - ./study-service/alembic:/app/alembic
      - shared_uploads:/app/uploads
    networks:
      default:
        aliases:
          - study.studyflow.internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  # AI Service
  ai-service:
    build:
      context: ./ai-service
    container_name: studyflow_ai
    ports:
      - "8002:8002"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - STUDY_SERVICE_URL=http://study-service:8000
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-20b}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
    volumes:
      - shared_uploads:/app/uploads
      - ai_storage:/app/ai-storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  # API Gateway
  # Same image as production. The aliases above let nginx.conf's Cloud Map
  # hostnames resolve through Docker's embedded DNS.
  api-gateway:
    build:
      context: ./api-gateway
    container_name: studyflow_gateway
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    environment:
      - NGINX_RESOLVER=127.0.0.11
    depends_on:
      auth-service:
        condition: service_healthy
      study-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres_data:
  shared_uploads:
  ai_storage:
