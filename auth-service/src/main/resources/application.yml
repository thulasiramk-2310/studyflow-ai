server:
  port: ${AUTH_SERVICE_PORT:8080}

spring:
  application:
    name: auth-service
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:studyflow}
    username: ${DB_USER:studyflow}
    password: ${DB_PASSWORD:studyflow}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    # The database is shared with study-service, so the schema is often
    # non-empty when auth-service first starts. Baselining at 0 (not the
    # default 1) makes sure V1 still runs in that case.
    baseline-on-migrate: true
    baseline-version: 0

jwt:
  secret: ${JWT_SECRET}

internal:
  api:
    key: ${INTERNAL_API_KEY}

# Public URL of the frontend, used in password reset links.
app:
  base-url: ${APP_BASE_URL:http://localhost}

study:
  service:
    url: ${STUDY_SERVICE_URL:http://study-service:8000}

# Password reset email. Empty SMTP_HOST disables sending (the request still succeeds).
mail:
  from: ${MAIL_FROM:${SMTP_USER:}}

springdoc:
  swagger-ui:
    path: /auth/docs
  api-docs:
    path: /auth/v3/api-docs

management:
  endpoints:
    web:
      base-path: /auth/actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
