name: CI

# Runs on every pull request (no path filters), so the required checks on main
# always report and a docs-only PR is never left waiting.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: ffmpeg (audio tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: ai-service tests
        working-directory: ai-service
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q
      - name: study-service tests
        working-directory: study-service
        run: |
          pip install -r requirements.txt pytest
          python -m pytest -q
      - name: deploy script tests
        run: |
          bash deploy/tests/test_remote_deploy.sh
          python -m pytest -q -p no:cacheprovider scripts/tests

  auth-tests:
    name: Auth tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: auth-service tests
        working-directory: auth-service
        run: mvn -q -B test

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (oxlint, colour and wording guards)
        run: npm run lint
      - name: Type check and build
        run: npm run build

  docker-images:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API Gateway
        run: docker build -t studyflow-api-gateway:test ./api-gateway
      - name: Build Auth Service
        run: docker build -t studyflow-auth-service:test ./auth-service
      - name: Build Study Service
        run: docker build -t studyflow-study-service:test ./study-service
      - name: Build AI Service
        run: docker build -t studyflow-ai-service:test ./ai-service
