<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d">
  <title id="t">StudyFlow architecture</title>
  <desc id="d">Browser to Caddy HTTPS to an nginx gateway, which routes to the Spring Boot auth service, the FastAPI study service and the FastAPI AI service. Each service has its own PostgreSQL database; the AI service keeps per-group FAISS indexes and calls Groq; auth sends reset email over SMTP.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7a857e"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2f6b4f"/></marker>
  </defs>
  <rect width="1200" height="600" rx="20" fill="#f4f1ea"/>
  <rect x="0.5" y="0.5" width="1199" height="599" rx="19.5" fill="none" stroke="#e2ddd2"/>
  <g font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="40" y="50" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#1b1f1c">How StudyFlow fits together</text>
    <text x="40" y="76" font-size="14" fill="#6b746e">Three services behind one gateway, each with its own database. Docker Compose locally; one VM with Caddy HTTPS in production.</text>

    <rect x="40" y="108" width="200" height="74" rx="12" fill="#fff" stroke="#d9d3c7"/>
    <text x="140" y="140" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1f1c">Browser</text>
    <text x="140" y="162" font-size="12.5" text-anchor="middle" fill="#6b746e">React + TypeScript SPA</text>
    <rect x="300" y="108" width="200" height="74" rx="12" fill="#fff" stroke="#d9d3c7"/>
    <text x="400" y="140" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1f1c">Caddy</text>
    <text x="400" y="162" font-size="12.5" text-anchor="middle" fill="#6b746e">HTTPS · serves the frontend</text>
    <rect x="560" y="108" width="240" height="74" rx="12" fill="#fff" stroke="#d9d3c7"/>
    <text x="680" y="140" font-size="16" font-weight="700" text-anchor="middle" fill="#1b1f1c">nginx gateway</text>
    <text x="680" y="162" font-size="12.5" text-anchor="middle" fill="#6b746e">routing · rate limits</text>
    <line x1="240" y1="145" x2="298" y2="145" stroke="#7a857e" stroke-width="2" marker-end="url(#a)"/>
    <line x1="500" y1="145" x2="558" y2="145" stroke="#7a857e" stroke-width="2" marker-end="url(#a)"/>

    <line x1="620" y1="182" x2="210" y2="252" stroke="#7a857e" stroke-width="2" marker-end="url(#a)"/>
    <line x1="680" y1="182" x2="600" y2="252" stroke="#7a857e" stroke-width="2" marker-end="url(#a)"/>
    <text x="350" y="214" font-size="12" fill="#6b746e">/auth/*</text>
    <text x="650" y="224" font-size="12" fill="#6b746e">/api/v1/*</text>

    <rect x="60" y="254" width="300" height="130" rx="14" fill="#fff" stroke="#2f6b4f" stroke-width="1.5"/>
    <text x="80" y="284" font-size="17" font-weight="700" fill="#1f4a36">Auth service</text>
    <text x="80" y="306" font-size="13" fill="#3d4741">Spring Boot · Spring Security · Flyway</text>
    <text x="80" y="330" font-size="12.5" fill="#6b746e">JWT in HttpOnly cookie · account type</text>
    <text x="80" y="348" font-size="12.5" fill="#6b746e">password change, reset and revocation</text>
    <text x="80" y="366" font-size="12.5" fill="#6b746e">account deletion</text>

    <rect x="450" y="254" width="300" height="130" rx="14" fill="#fff" stroke="#2f6b4f" stroke-width="1.5"/>
    <text x="470" y="284" font-size="17" font-weight="700" fill="#1f4a36">Study service</text>
    <text x="470" y="306" font-size="13" fill="#3d4741">FastAPI · SQLAlchemy · Alembic · 4 workers</text>
    <text x="470" y="330" font-size="12.5" fill="#6b746e">groups, invite codes, sessions, notes</text>
    <text x="470" y="348" font-size="12.5" fill="#6b746e">quizzes, flashcards, notifications</text>
    <text x="470" y="366" font-size="12.5" fill="#6b746e">proxies AI requests · job leases</text>

    <rect x="840" y="254" width="320" height="130" rx="14" fill="#fff" stroke="#2f6b4f" stroke-width="1.5"/>
    <text x="860" y="284" font-size="17" font-weight="700" fill="#1f4a36">AI service</text>
    <text x="860" y="306" font-size="13" fill="#3d4741">FastAPI · LangGraph agents · MCP tools</text>
    <text x="860" y="330" font-size="12.5" fill="#6b746e">RAG chat, planner, summaries, quizzes</text>
    <text x="860" y="348" font-size="12.5" fill="#6b746e">indexes PDF, Word, PowerPoint, Markdown</text>
    <text x="860" y="366" font-size="12.5" fill="#6b746e">guardrails on every model call</text>

    <line x1="360" y1="318" x2="448" y2="318" stroke="#2f6b4f" stroke-width="2" stroke-dasharray="6 5" marker-start="url(#g)" marker-end="url(#g)"/>
    <line x1="750" y1="318" x2="838" y2="318" stroke="#2f6b4f" stroke-width="2" stroke-dasharray="6 5" marker-start="url(#g)" marker-end="url(#g)"/>
    <text x="404" y="308" font-size="11.5" text-anchor="middle" fill="#2f6b4f">internal key</text>
    <text x="794" y="308" font-size="11.5" text-anchor="middle" fill="#2f6b4f">internal key</text>

    <g font-size="13">
      <rect x="110" y="430" width="200" height="62" rx="31" fill="#e3efe7"/>
      <text x="210" y="457" text-anchor="middle" font-weight="700" fill="#1f4a36">PostgreSQL</text>
      <text x="210" y="476" text-anchor="middle" fill="#3d4741">users · reset tokens</text>
      <rect x="500" y="430" width="200" height="62" rx="31" fill="#e3efe7"/>
      <text x="600" y="457" text-anchor="middle" font-weight="700" fill="#1f4a36">PostgreSQL</text>
      <text x="600" y="476" text-anchor="middle" fill="#3d4741">study data · uploads volume</text>
      <rect x="840" y="430" width="150" height="62" rx="31" fill="#e3efe7"/>
      <text x="915" y="457" text-anchor="middle" font-weight="700" fill="#1f4a36">PostgreSQL</text>
      <text x="915" y="476" text-anchor="middle" fill="#3d4741">chats · plans</text>
      <rect x="1010" y="430" width="150" height="62" rx="31" fill="#e3efe7"/>
      <text x="1085" y="457" text-anchor="middle" font-weight="700" fill="#1f4a36">FAISS</text>
      <text x="1085" y="476" text-anchor="middle" fill="#3d4741">index per group</text>
    </g>
    <line x1="210" y1="384" x2="210" y2="428" stroke="#7a857e" stroke-width="2" marker-end="url(#a)"/>
    <line x1="600" y1="384" x2="600" y2="428" stroke="#7a857e" stroke-width="2" marker-end="url(#a)"/>
    <line x1="930" y1="384" x2="918" y2="428" stroke="#7a857e" stroke-width="2" marker-end="url(#a)"/>
    <line x1="1070" y1="384" x2="1082" y2="428" stroke="#7a857e" stroke-width="2" marker-end="url(#a)"/>

    <rect x="60" y="526" width="300" height="46" rx="10" fill="#fff" stroke="#d9d3c7" stroke-dasharray="5 4"/>
    <text x="210" y="554" text-anchor="middle" font-size="13" fill="#3d4741">SMTP · password reset email</text>
    <rect x="840" y="526" width="320" height="46" rx="10" fill="#fff" stroke="#d9d3c7" stroke-dasharray="5 4"/>
    <text x="1000" y="554" text-anchor="middle" font-size="13" fill="#3d4741">Groq API · gpt-oss-20b · key failover</text>
    <line x1="80" y1="384" x2="80" y2="524" stroke="#7a857e" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a)"/>
    <line x1="1150" y1="384" x2="1150" y2="524" stroke="#7a857e" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a)"/>
  </g>
</svg>
